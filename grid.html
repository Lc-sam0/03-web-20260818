<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viagens</title>
    
    <style>
           * {
            font-size: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
          .container {
            display: grid;
            gap: .2rem;          
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            align-items: center;
            padding: 0.5rem;
            justify-items: center;
            border: 0.2rem solid purple;
            border-radius: 0.5rem;
            width: auto;     
            height: auto;      
                
     
        }
         .item {
            width: 10rem;
            height: 2rem;
            border: .1rem solid rgb(7, 7, 7);
            border-radius: .5rem;
            padding: 0.5rem;
            width: auto;
            height: 20rem; 
      
        }
        .cabeca{
            border: 0.1rem solid purple;
            background-color: blueviolet;
            width: auto;
            height: 3rem;
            border-radius: 0.5rem;
            justify-content: center;
            align-items: center;
            display: flex;
        }
        
        
    </style>     
</head>

<body>
    <div class="cabeca">Agencia de Viagens</div>
    <div class="container">
        <div class="item">Origem</div>
        <div class="item">Destino</div>
        <div class="item">Dias</div>
        <div class="item">Preço</div>
   
    </div>
    <section>
        <div class="img">Imagnes</div>
    </section>
</body>

</html>
