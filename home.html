<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="accents/css/home/estilo.css">
    <script src="https://kit.fontawesome.com/db00d7d39c.js" crossorigin="anonymous"></script>
    <script src="./accents/js/menu_hamburguer.js"></script>
    <script src="./accents/js/home.js" type="module"></script>

<body>
    <header>
        <div id="logoDoSite" class="logo">L</div>
        <h1 class="titulo">C_News</h1>
        <div class="menu-hamburguer" onclick="alternarVisualizacaoDoMenuLateral()">
            <i id="icone" class="fa-solid fa-bars"></i>
        </div>
    </header>

    <section>
        <nav>
            <span>Menu Lateral</span>
            <ul class="menu-lateral">
                <li id="opcao-noticia">
                    <a href="#">
                        <div class="opcao">
                            <div class="icone-inicial">
                                <i class="fa-solid fa-newspaper"></i>
                            </div>
                            <div class="rotulo">Noticia</div>
                            <div class="icone-final">
                                <i class="fa-solid fa-chevron-right"></i>
                            </div>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <div class="opcao">
                            <div class="icone-inicial">
                                <i class="fa-solid fa-envelope"></i>
                            </div>
                            <div class="rotulo">Mensagem</div>
                            <div class="icone-final">
                                <i class="fa-solid fa-chevron-right"></i>
                            </div>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <div class="opcao">
                            <div class="icone-inicial">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <div class="rotulo">Perfil</div>
                            <div class="icone-final">
                                <i class="fa-solid fa-chevron-right"></i>
                            </div>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="./index.html">
                        <div class="opcao">
                            <div class="icone-inicial">
                                <i class="fa-solid fa-right-from-bracket"></i>
                            </div>
                            <div class="rotulo">Sair</div>
                            <div class="icone-final">
                                <i class="fa-solid fa-chevron-right"></i>
                            </div>
                        </div>
                    </a>
                </li>
            </ul>
        </nav>

        <main id="noticias" class="container">
           
        </main>
    </section>

    <footer>&copy; Meu Site, 2026, ❤️</footer>

</html>
