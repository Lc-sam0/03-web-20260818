<!DOCTYPE html>

        <h1 class="titulo">C_News</h1>

    <section class="conteudo-principal">

                    <p class="classificacao">

                    </p>
                    <!--Botao-->  
                    <button type="button" class="botao-ok">OK</button>                                       

                    <p class="descricao-da-noticia">
